<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login — Study Campus</title><link rel="stylesheet" href="/styles.css"></head>
<body class="auth-page">
<div class="auth-wrap">
<a class="brand auth-brand" href="/" aria-label="Study Campus home"><img class="brand-logo" src="/assets/study-campus-logo.svg" alt="Study Campus"></a>
<div class="auth-card card">
<div class="tabs"><button class="tab active" data-tab="login">Login</button><button class="tab" data-tab="register">Create Account</button></div>
<form id="loginForm"><h1>Welcome back</h1><p>Login to upload notes and manage your contributions.</p><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn btn-primary full" type="submit">Login</button><p class="form-msg" id="loginMsg"></p></form>
<form id="registerForm" hidden><h1>Join Study Campus</h1><p>Create a free student account.</p><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="btn btn-primary full" type="submit">Create Account</button><p class="form-msg" id="registerMsg"></p></form>
</div><a href="/" class="back-link">← Back to Study Campus</a>
</div>
<script src="/app.js"></script>
<script src="/auth.js"></script>
</body>
</html>
